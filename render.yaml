# Render Blueprint: ONE service runs the Neon Arcade hub (landing page + private rooms for both games).
# Render > New > Blueprint > pick the repo > Apply.
services:
  - type: web
    name: neon-arcade
    runtime: node
    plan: free            # stays free: the service sleeps after ~15 min idle and wakes on the next visit
    buildCommand: "echo no build needed"
    startCommand: node hub.js
    healthCheckPath: /api/status
    envVars:
      - key: MAX_ROOMS
        value: "8"        # each room is one process (~50 MB measured) + hub (~48 MB): 8 rooms fit in 512 MB
      - key: ROOM_IDLE_MINUTES
        value: "10"       # empty rooms close after this long
